# Managed by Devin / Sosoka Labs
name: AI Council Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - feature/ai-council-v0.2.0

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-council-review:
    name: AI Council Review
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    steps:
      - name: Checkout AI Council
        uses: actions/checkout@v4
        with:
          repository: Sosoka-Labs/ai-council-code-review
          ref: v0.2.0
          path: ./ai-council-code-review

      - name: Checkout PR HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ./target-repo

      - name: Fetch base branch
        working-directory: ./target-repo
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.5.5'

      - name: Install AI Council dependencies
        working-directory: ./ai-council-code-review
        run: uv pip install --system -e .

      - name: Run AI Council Review
        working-directory: ./ai-council-code-review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_COUNCIL__REPO_PATH: ${{ github.workspace }}/target-repo
          AI_COUNCIL__PR_NUMBER: ${{ github.event.number }}
          AI_COUNCIL__CONFIG_PATH: ${{ github.workspace }}/target-repo/.ai-council/config.yaml
        run: python -m ai_council_code_review
