[project]
name = "openpaw-ai"
version = "0.4.0"
description = "OpenPaw - Multi-Channel AI Agent Framework with LangGraph"
authors = [
    {name = "John Sosoka"}
]
license = "PolyForm Noncommercial 1.0.0"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["ai", "agent", "langgraph", "telegram", "discord", "bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Chat",
    "Framework :: AsyncIO",
]
requires-python = ">=3.11,<4.0"
dependencies = [
    # Agent runtime
    "langchain (>=1.2.8,<2.0.0)",
    "langgraph (>=1.0.7,<2.0.0)",
    "langgraph-checkpoint-sqlite (>=2.0.0,<4.0.0)",
    # LLM providers
    "langchain-anthropic (>=1.3.1,<2.0.0)",
    "langchain-aws (>=1.0.0,<2.0.0)",
    "langchain-openai (>=1.1.7,<2.0.0)",
    "langchain-xai (>=1.2.2,<2.0.0)",
    "langchain-fireworks (>=1.0.0,<2.0.0)",
    # Channel adapters
    "python-telegram-bot[job-queue] (>=22.6,<23.0)",
    "discord.py (>=2.6.0,<3.0.0)",
    # Configuration and scheduling
    "pydantic (>=2.12.5,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "apscheduler (>=3.10.0,<4.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    # Document processing and browser automation
    "docling (>=2.72.0,<3.0.0)",
    "easyocr (>=1.7.2,<2.0.0)",
    "opencv-python-headless (>=4.13.0.92,<5.0.0.0)",
    "playwright (>=1.58.0,<2.0.0)",
]

[project.urls]
Homepage = "https://johnsosoka.github.io/OpenPaw/"
Repository = "https://github.com/johnsosoka/OpenPaw"
Issues = "https://github.com/johnsosoka/OpenPaw/issues"
Documentation = "https://johnsosoka.github.io/OpenPaw/"

[project.optional-dependencies]
# Optional builtins — install extras for specific capabilities
voice = [
    "openai (>=1.0.0)",      # Whisper transcription
    "elevenlabs (>=1.0.0)",  # Text-to-speech
]
web = [
    "langchain-community (>=0.4.0)",  # Brave Search
]
memory = [
    "sqlite-vec (>=0.1.6)",  # Semantic search over conversation archives
]
researcher = [
    "websockets (>=12.0)",  # GPT-Researcher WebSocket streaming
    "httpx (>=0.27.0)",     # GPT-Researcher file upload
]
email = [
    "google-auth (>=2.0.0)",              # Google service account auth
    "google-api-python-client (>=2.0.0)", # Gmail API client
]
all-builtins = [
    "openai (>=1.0.0)",
    "elevenlabs (>=1.0.0)",
    "langchain-community (>=0.4.0)",
    "sqlite-vec (>=0.1.6)",
    "websockets (>=12.0)",
    "httpx (>=0.27.0)",
    "google-auth (>=2.0.0)",
    "google-api-python-client (>=2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "ruff (>=0.15.0,<0.16.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "types-PyYAML (>=6.0.0)"
]
docs = [
    "zensical (>=0.0.24)"
]

[project.scripts]
openpaw = "openpaw.cli:run"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

[tool.poetry]
name = "openpaw-ai"
version = "0.4.0"
description = "OpenPaw - Multi-Channel AI Agent Framework with LangGraph"
authors = ["John Sosoka"]
packages = [{include = "openpaw"}]
include = ["CHANGELOG.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
